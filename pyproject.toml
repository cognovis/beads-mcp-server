[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "beads-mcp-server"
version = "0.1.0"
description = "Stateless MCP SDK v2 adapter for the bd command-line client"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Cognovis" }]
dependencies = [
  "mcp>=2.0.0,<3",
  "pydantic>=2.12,<3",
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
]

[project.urls]
Repository = "https://github.com/cognovis/beads-mcp-server"
Issues = "https://github.com/cognovis/beads-mcp-server/issues"

[project.scripts]
beads-mcp-server = "beads_mcp_server.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beads_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
